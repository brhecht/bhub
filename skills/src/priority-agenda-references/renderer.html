<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Priority Agenda",
  "schemaVersion": 1,
  "description": "Brian's live priority agenda, pulled fresh from the Linear document \"Brian's priority agenda\" (Team Ops) each time it opens, then cross-checked against live Linear issue status. Same document Nico reads, so the two never drift.",
  "mcpTools": [
    "mcp__638f3656-20d7-4323-9149-4d05bd4d13fe__get_document",
    "mcp__638f3656-20d7-4323-9149-4d05bd4d13fe__list_issues",
    "mcp__2818b737-df40-4ae8-8d87-4468c0475010__list_events"
  ],
  "mcpServerNames": [
    "Linear",
    "Google Calendar"
  ]
}
</script>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Priority Agenda</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 22px 40px;
  background: #ffffff;
  color: #16181d;
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding-bottom: 12px; border-bottom: 2px solid #16181d;
  margin-bottom: 18px; flex-wrap: wrap;
}
h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.stamp { font-size: 11px; color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; }
h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 700; color: #6b7280; margin: 24px 0 12px;
  padding-bottom: 5px; border-bottom: 1px solid #e5e7eb;
}
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin: 22px 0 9px; }
h3.blocked { color: #b42318; }
h3.cleared { color: #15803d; }
h3.plain { color: #6b7280; }
p { margin: 0 0 11px; }
a { color: #1d4ed8; text-decoration: none; border-bottom: 1px solid rgba(29,78,216,.28); }
a:hover { border-bottom-color: #1d4ed8; }
strong { font-weight: 650; }
.item {
  border-left: 3px solid #16181d; padding: 10px 0 10px 13px; margin: 0 0 11px;
  background: #fafafa; border-radius: 0 4px 4px 0;
}
.item.rank1 { border-left-color: #b42318; background: #fef6f5; }
.item .title { font-weight: 650; display: block; margin-bottom: 3px; }
.item .body { margin: 0; color: #374151; font-size: 14px; }
.blockbox { background: #fff8f2; border: 1px solid #fde3cc; border-radius: 6px; padding: 4px 12px 12px; }
.blockbox p { font-size: 14px; color: #4b5563; }
.item.blk {
  border-left: 3px solid #d97706;
  border-top: 1px solid #fde3cc;
  border-right: 1px solid #fde3cc;
  border-bottom: 1px solid #fde3cc;
  background: #ffffff;
  padding: 9px 12px 9px 12px;
  margin: 0 0 8px;
}
.item.blk:last-child { margin-bottom: 2px; }
.item.blk .title { color: #7c2d12; }

/* Live drift check against Linear.
   Nothing is ever struck through. Done means the line moved to Cleared
   today in the document; a closed issue still ranked here is drift, and
   drift raises a rebuild banner instead of restyling the item. */
.checknote { font-size: 11px; color: #9ca3af; margin: -4px 0 14px; }
.rebuild {
  background: #fff8f2; border: 1px solid #f0b27a; border-left: 4px solid #d97706;
  border-radius: 6px; padding: 11px 14px; margin: 0 0 18px;
  font-size: 13px; line-height: 1.55; color: #7c2d12;
}
.rebuild b { font-weight: 700; }
.rebuild .ids { font-variant-numeric: tabular-nums; color: #9a3412; }
.item ul.sub { margin: 6px 0 0; padding-left: 18px; }
.item ul.sub li { margin-bottom: 4px; color: #374151; font-size: 14px; }
.item ul.sub li:last-child { margin-bottom: 0; }

.muted { color: #4b5563; font-size: 14px; }
ul { margin: 0 0 11px; padding-left: 20px; }
li { margin-bottom: 5px; }
.state { padding: 30px 0; color: #6b7280; font-size: 14px; }
.err { color: #b42318; }
.appt { display: flex; gap: 10px; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #f1f2f4; }
.appt:last-child { border-bottom: 0; }
.appt .t { color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 74px; }
.appt .n { color: #16181d; }
.daylabel { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #9ca3af; font-weight: 700; margin: 12px 0 4px; }
.foot { margin-top: 28px; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>Priority Agenda</h1>
  <span class="stamp" id="stamp"></span>
</header>
<div id="out"><div class="state">Loading from Linear&hellip;</div></div>

<script>
var DOC_ID = "4aa0b7df0286";
var DOC_URL = "https://linear.app/humbleconviction/document/brians-priority-agenda-4aa0b7df0286";
var LINEAR_DOC = "mcp__638f3656-20d7-4323-9149-4d05bd4d13fe__get_document";
var LINEAR_ISSUES = "mcp__638f3656-20d7-4323-9149-4d05bd4d13fe__list_issues";
var CALENDAR = "mcp__2818b737-df40-4ae8-8d87-4468c0475010__list_events";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* Linear stores issue refs as <issue id=".." href="URL">TNB-123</issue>.
   Pull them out into a table before escaping, then re-insert as anchors. */
var LINKS = [];
function stashLinks(raw) {
  LINKS = [];
  return raw.replace(/<issue\b[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/issue>/g, function (m, href, text) {
    LINKS.push({ href: href, text: text });
    return "@@L" + (LINKS.length - 1) + "@@";
  });
}
function popLinks(html) {
  return html.replace(/@@L(\d+)@@/g, function (m, i) {
    var L = LINKS[Number(i)];
    if (!L) return "";
    return '<a href="' + esc(L.href) + '" target="_blank" rel="noopener">' + esc(L.text) + "</a>";
  });
}
function inline(text) {
  var t = esc(text);
  t = t.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
  return popLinks(t);
}

function render(md) {
  var lines = md.split("\n");
  var html = "";
  var buf = [];
  var inList = false;
  var openItem = false;
  var boxOpen = false;
  var mutedSection = false;
  var callSheet = false;

  function closeItem() { closeList(); if (openItem) { html += "</div>"; openItem = false; } }
  function closeBox() { closeItem(); if (boxOpen) { html += "</div>"; boxOpen = false; } }
  function closeList() { if (inList) { html += "</ul>"; inList = false; } }

  function flush() {
    if (!buf.length) return;
    var joined = buf.join(" ").trim();
    buf = [];
    if (!joined) return;
    var m = joined.match(/^\*\*(\d+)\.\s*([\s\S]+?)\*\*([\s\S]*)$/);
    if (!m) {
      /* Linear drops the bold markers when it normalises the document, so a
         ranked item often comes back as plain "3. Title". Treat that the same. */
      var bare = joined.match(/^(\d+)\.\s+([\s\S]+)$/);
      if (bare) m = [bare[0], bare[1], bare[2], ""];
    }
    if (m) {
      closeItem();
      html += '<div class="item' + (m[1] === "1" ? " rank1" : "") + '">';
      html += '<span class="title">' + m[1] + ". " + inline(m[2]) + inline(m[3]) + "</span>";
      openItem = true;
      return;
    }
    /* Inside a Blocked box, a bold-led line becomes its own card, no rank number. */
    if (boxOpen) {
      var b = joined.match(/^\*\*([\s\S]+?)\*\*([\s\S]*)$/);
      if (b) {
        closeItem();
        html += '<div class="item blk">';
        html += '<span class="title">' + inline(b[1]) + inline(b[2]) + "</span>";
        openItem = true;
        return;
      }
    }
    if (openItem) {
      html += '<p class="body">' + inline(joined) + "</p>";
      return;
    }
    var pcls = callSheet ? "muted cs" : (mutedSection ? "muted" : "");
    html += "<p" + (pcls ? ' class="' + pcls + '"' : "") + ">" + inline(joined) + "</p>";
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].replace(/\s+$/, "");
    if (!line.trim()) { flush(); closeList(); continue; }

    if (/^###\s+/.test(line)) {
      flush(); closeList(); closeBox();
      var t = line.replace(/^###\s+/, "").trim();
      var low = t.toLowerCase();
      var cls = "plain";
      mutedSection = true;
      callSheet = low.indexOf("call sheet") > -1;
      if (low.indexOf("block") > -1) {
        cls = "blocked";
        html += '<div class="blockbox">';
        boxOpen = true;
      } else if (low.indexOf("cleared") > -1) {
        cls = "cleared";
      }
      html += '<h3 class="' + cls + '">' + inline(t) + "</h3>";
      continue;
    }
    if (/^##\s+/.test(line)) {
      flush(); closeList(); closeBox();
      mutedSection = false;
      callSheet = false;
      html += "<h2>" + inline(line.replace(/^##\s+/, "")) + "</h2>";
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      flush();
      if (!inList) { html += "<ul" + (openItem ? ' class="sub"' : "") + ">"; inList = true; }
      html += "<li>" + inline(line.replace(/^[-*]\s+/, "")) + "</li>";
      continue;
    }
    buf.push(line);
  }
  flush(); closeList(); closeBox();
  return html;
}

/* ---- Live drift check ---------------------------------------------------
   The document holds the ranking and the wording. Linear holds the truth
   about whether something is still open.

   Done is NOT a strikethrough. When something is finished, its line moves
   out of the ranked list into Cleared today, in the document. If an issue
   is closed in Linear but still sitting in a live position here, that is
   drift: the document is behind, and the fix is to rebuild the agenda.
   So this raises one banner naming the offenders. It never restyles,
   dims, or strikes through an item, because a struck-through line reads
   as handled and that is exactly the wrong signal.

   Live positions only: ranked cards, blocked cards, their sub-bullets,
   and call-sheet lines. Cleared today and Cleared yesterday are supposed
   to hold closed issues and are skipped.
   Fails silently: if the lookup errors, the agenda still renders. */
function crossCheckStatuses() {
  /* Titles only, never a body line. A body line legitimately names a closed
     issue as an adjacent fact ("Wednesday's post, TNB-217, is canceled") and
     that is not drift. */
  var scopes = document.querySelectorAll("#out .item > .title, #out .item ul.sub li, #out p.cs");
  if (!scopes.length) return;

  window.cowork.callMcpTool(LINEAR_ISSUES, {
    team: "The New Builder",
    includeArchived: true,
    limit: 250,
    fields: ["id", "status", "statusType"]
  }).then(function (r) {
    if (r.isError) throw new Error("issue lookup failed");
    var data = r.structuredContent;
    if (!data) data = JSON.parse(r.content[0].text);
    var byId = {};
    (data.issues || []).forEach(function (it) { byId[it.id] = it; });

    var stale = [], seen = {};
    Array.prototype.forEach.call(scopes, function (el) {
      Array.prototype.forEach.call(el.querySelectorAll("a"), function (a) {
        var id = a.textContent.trim();
        if (!/^TNB-\d+$/.test(id) || seen[id]) return;
        var rec = byId[id];
        if (!rec) return;
        if (rec.statusType !== "completed" && rec.statusType !== "canceled") return;
        seen[id] = 1;
        stale.push(id);
      });
    });

    var t = new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    var note = document.getElementById("checknote");

    if (!stale.length) {
      if (note) note.textContent = "Checked against Linear at " + t + ". Everything below is still open.";
      return;
    }

    if (note) note.textContent = "Checked against Linear at " + t + ".";

    var one = stale.length === 1;
    var banner = document.createElement("div");
    banner.className = "rebuild";
    banner.innerHTML =
      "<b>This agenda is behind Linear.</b> " +
      (one ? "One item" : stale.length + " items") +
      " below " + (one ? "is" : "are") + " already closed in Linear but still " +
      (one ? "sits" : "sit") + " in a live position: " +
      '<span class="ids">' + esc(stale.join(", ")) + "</span>. " +
      "Rebuild the agenda to move " + (one ? "it" : "them") + " into Cleared today.";

    var out = document.getElementById("out");
    if (out) out.insertBefore(banner, out.firstChild);
  }).catch(function (e) {
    var note = document.getElementById("checknote");
    if (note) note.textContent = "Could not check live status against Linear.";
  });
}

function load() {
  var out = document.getElementById("out");
  window.cowork.callMcpTool(LINEAR_DOC, { id: DOC_ID }).then(function (r) {
    if (r.isError) throw new Error("Linear returned an error");
    var data = r.structuredContent;
    if (!data) data = JSON.parse(r.content[0].text);
    var md = data.content || "";

    /* Skip the explanatory preamble, start at the first dated section. */
    var body = md;
    var cut = md.search(/^##\s+(Today|Tomorrow|Mon|Tue|Wed|Thu|Fri|Sat|Sun)/m);
    if (cut > -1) body = md.slice(cut);

    var rendered = render(stashLinks(body));
    /* Drop the live-check note directly under the day heading. */
    rendered = rendered.replace("</h2>", '</h2><div class="checknote" id="checknote">Checking live status&hellip;</div>');

    out.innerHTML = rendered +
      '<h3 class="plain">Upcoming appointments</h3><div id="appts" class="muted">Loading&hellip;</div>' +
      '<div class="foot">Live from Linear. Nico reads the same document.<br>' +
      '<a href="' + DOC_URL + '" target="_blank" rel="noopener">Open in Linear</a></div>';

    if (data.updatedAt) {
      var d = new Date(data.updatedAt);
      document.getElementById("stamp").textContent = "updated " +
        d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    crossCheckStatuses();
    loadAppointments();
  }).catch(function (e) {
    out.innerHTML = '<div class="state err">Could not load the agenda from Linear.<br>' +
      esc(e && e.message ? e.message : e) + "</div>";
  });
}

function fmtTime(iso) {
  var d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }).replace(" ", "").toLowerCase();
}

function loadAppointments() {
  var box = document.getElementById("appts");
  if (!box) return;
  var now = new Date();
  var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  window.cowork.callMcpTool(CALENDAR, {
    startTime: now.toISOString(), endTime: end.toISOString(), orderBy: "startTime", pageSize: 25
  }).then(function (r) {
    if (r.isError) throw new Error("calendar error");
    var data = r.structuredContent;
    if (!data) data = JSON.parse(r.content[0].text);
    var evs = (data.events || []).filter(function (e) { return e.start && e.start.dateTime; });

    // Collapse duplicate entries for the same event (same title + same start).
    var seen = {}, list = [];
    evs.forEach(function (e) {
      var k = (e.summary || "") + "|" + e.start.dateTime;
      if (seen[k]) return;
      seen[k] = 1;
      list.push(e);
    });
    list.sort(function (a, b) { return new Date(a.start.dateTime) - new Date(b.start.dateTime); });

    if (!list.length) { box.innerHTML = "Nothing left today."; return; }

    var html = "";
    list.forEach(function (e) {
      html += '<div class="appt"><span class="t">' + fmtTime(e.start.dateTime) +
              '</span><span class="n">' + esc(e.summary || "(no title)") + "</span></div>";
    });
    box.innerHTML = html;
  }).catch(function (e) {
    box.innerHTML = '<span class="err">Could not load calendar.</span>';
  });
}

load();
</script>
</body>
</html>
